services:
  postgres:
    image: postgres:16
    container_name: sac-geo-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sacgeo_dev}
      POSTGRES_USER: ${POSTGRES_USER:-sacgeo_dev}
      # Sin valor por defecto: `:?` aborta si falta o esta vacia. El resto de
      # las variables si lo tienen porque ninguna es un secreto.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env (vea .env.example)}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sac-geo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sacgeo_dev} -d ${POSTGRES_DB:-sacgeo_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sac-geo-net

networks:
  sac-geo-net:
    name: sac-geo-net

volumes:
  sac-geo-postgres-data:
    name: sac-geo-postgres-data
